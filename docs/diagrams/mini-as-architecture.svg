<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6573"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243447}.title{font-size:18px;font-weight:700}.node{font-size:13px}.edge{font-size:11px;fill:#46515f}.box{stroke-width:2}.line{fill:none;stroke:#5b6573;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <rect x="30" y="30" width="1440" height="280" rx="16" fill="#edf5ff" stroke="#6c8ebf" stroke-width="2"/><text x="55" y="65" class="title">构建期：源码 → 带类型信息的字节码</text>
  <g class="node" text-anchor="middle"><rect class="box" x="60" y="130" width="150" height="70" rx="10" fill="#f5f5f5" stroke="#666"/><text x="135" y="158"><tspan x="135">源码分区</tspan><tspan x="135" dy="20">Source Sections</tspan></text>
  <rect class="box" x="250" y="120" width="170" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf"/><text x="335" y="148"><tspan x="335">Tokenizer</tspan><tspan x="335" dy="19">字符 → Token</tspan><tspan x="335" dy="19">保留行列与分区</tspan></text>
  <rect class="box" x="460" y="120" width="170" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf"/><text x="545" y="148"><tspan x="545">Parser</tspan><tspan x="545" dy="19">递归下降</tspan><tspan x="545" dy="19">兄弟链 AST</tspan></text>
  <rect class="box" x="670" y="120" width="170" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6"/><text x="755" y="148"><tspan x="755">TypeChecker</tspan><tspan x="755" dy="19">作用域 / 签名</tspan><tspan x="755" dy="19">表达式类型标注</tspan></text>
  <rect class="box" x="880" y="120" width="190" height="90" rx="10" fill="#ffe6cc" stroke="#d79b00"/><text x="975" y="148"><tspan x="975">BytecodeCompiler</tspan><tspan x="975" dy="19">类型化 Opcode</tspan><tspan x="975" dy="19">回填 / 常量池</tspan></text>
  <rect class="box" x="1110" y="110" width="290" height="110" rx="10" fill="#d5e8d4" stroke="#82b366"/><text x="1255" y="142"><tspan x="1255">ScriptModule</tspan><tspan x="1255" dy="20">函数 + 常量 + 元数据</tspan><tspan x="1255" dy="20">链接宿主函数与对象类型</tspan></text></g>
  <path class="line" d="M210 165H250"/><path class="line" d="M420 165H460"/><path class="line" d="M630 165H670"/><path class="line" d="M840 165H880"/><path class="line" d="M1070 165H1110"/>
  <rect x="260" y="380" width="1050" height="310" rx="16" fill="#eff8ed" stroke="#82b366" stroke-width="2"/><text x="285" y="415" class="title">运行期：同一模块，多 Context 独立执行</text>
  <g class="node" text-anchor="middle"><rect class="box" x="320" y="480" width="180" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf"/><text x="410" y="508"><tspan x="410">ScriptContext</tspan><tspan x="410" dy="19">Prepare / SetArg</tspan><tspan x="410" dy="19">状态与返回值</tspan></text>
  <rect class="box" x="560" y="470" width="190" height="110" rx="10" fill="#ffe6cc" stroke="#d79b00"/><text x="655" y="504"><tspan x="655">VirtualMachine</tspan><tspan x="655" dy="20">pc + operand stack</tspan><tspan x="655" dy="20">switch(opcode)</tspan></text>
  <rect class="box" x="820" y="445" width="210" height="90" rx="10" fill="#fff2cc" stroke="#d6b656"/><text x="925" y="474"><tspan x="925">显式 CallFrame</tspan><tspan x="925" dy="19">function / pc / locals</tspan><tspan x="925" dy="19">递归、挂起、栈追踪</tspan></text>
  <rect class="box" x="820" y="575" width="210" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6"/><text x="925" y="604"><tspan x="925">ScriptObject + Handle</tspan><tspan x="925" dy="19">字段是 Value 数组</tspan><tspan x="925" dy="19">引用计数负责常规回收</tspan></text>
  <rect class="box" x="1080" y="575" width="180" height="90" rx="10" fill="#f8cecc" stroke="#b85450"/><text x="1170" y="604"><tspan x="1170">GarbageCollector</tspan><tspan x="1170" dy="19">只处理引用环</tspan><tspan x="1170" dy="19">试探删除</tspan></text>
  <rect class="box" x="30" y="485" width="180" height="110" rx="10" fill="#f5f5f5" stroke="#666" stroke-dasharray="8 5"/><text x="120" y="517"><tspan x="120">宿主 C++ 应用</tspan><tspan x="120" dy="20">注册 API / 创建模块</tspan><tspan x="120" dy="20">驱动 Context</tspan></text>
  </g>
  <path class="line" d="M1255 220V350H410V480"/><text x="780" y="343" class="edge">GetFunction → Prepare</text><path class="line" d="M210 540H320"/><text x="220" y="530" class="edge">驱动</text><path class="line" d="M500 525H560"/><path class="line" d="M750 500H820"/><text x="770" y="490" class="edge">CALL / RET</text><path class="line" d="M750 555V620H820"/><text x="760" y="606" class="edge">NEW / FIELD</text><path class="line" d="M1030 620H1080"/><path class="line" d="M655 580V720H120V595"/><text x="230" y="710" class="edge">CALL_HOST / GenericCall</text>
</svg>
